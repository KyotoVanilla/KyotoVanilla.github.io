name: Secure Webhook Example

on: [push]

jobs:
  send_webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook Securely
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{"content": "Hello from GitHub Actions!"}' \
            "$DISCORD_WEBHOOK"
            
